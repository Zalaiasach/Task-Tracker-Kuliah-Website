<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker Kuliah v2 — REST API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Task Tracker Kuliah <small style="font-size: 14px; color: #6b7280;">v2 · REST API</small></h1>
      <p>Kelola jadwal tugas dan praktikum dengan integrasi REST API</p>
    </header>

    <!-- Banner Pesan Kesalahan Form / Server -->
    <div id="form-error" class="alert-box error" style="display: none;"></div>

    <!-- Form Input Tugas -->
    <form id="task-form" class="card">
      <div class="form-group">
        <label for="task-title">Judul Tugas (min. 3 karakter)</label>
        <input type="text" id="task-title" placeholder="Contoh: Lab 10 Event Delegation" required minlength="3">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="task-category">Mata Kuliah</label>
          <select id="task-category" required>
            <option value="" disabled selected>Memuat mata kuliah...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="task-deadline">Tenggat Waktu</label>
          <input type="date" id="task-deadline" required>
        </div>
      </div>

      <button type="submit" id="btn-submit">Tambah Tugas</button>
    </form>

    <!-- Kontrol Filter, Pencarian, & Statistik -->
    <div class="tracker-controls card">
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="pending">Aktif</button>
        <button class="filter-btn" data-filter="completed">Selesai</button>
      </div>
      
      <!-- Input Pencarian (Bonus Debounce) -->
      <div class="search-box">
        <input type="text" id="task-search" placeholder="Cari tugas...">
      </div>

      <div class="stats">
        <span>Total: <strong id="total-count">0</strong></span>
        <span>Aktif: <strong id="pending-count">0</strong></span>
        <span>Selesai: <strong id="completed-count">0</strong></span>
      </div>
    </div>

    <!-- Kontainer Daftar Tugas & State -->
    <section>
      <!-- State Error Server + Retry Button -->
      <div id="server-error" class="alert-box error" style="display: none;">
        <span id="server-error-msg">Gagal memuat data dari server.</span>
        <button id="btn-retry" class="btn-action" style="margin-left: 10px; background-color: #ef4444; color: #fff;">Coba Lagi</button>
      </div>

      <!-- State Loading -->
      <div id="loading-state" class="empty-state" style="display: none;">
        Memuat data tugas...
      </div>

      <!-- List Tugas -->
      <ul id="task-list"></ul>

      <!-- State Kosong -->
      <p id="empty-state" class="empty-state" style="display: none;">Belum ada tugas tercatat.</p>
    </section>
  </div>

  <!-- Mock Backend API untuk simulasi REST API, Mode Offline, dan Lambat -->
  <script src="mock-api.js"></script>
  <!-- Main Application Logic -->
  <script src="app.js"></script>
</body>
</html>
